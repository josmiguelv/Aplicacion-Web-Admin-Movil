name: Admin B3 MOBILE_APP FORM S2S focal
on:
  push:
    branches: [fix/b3-mobile-form-to-tuverso-20261122, fix/b3-single-form-intake-rebased-20261122]
    paths:
      - 'server/tuverso-mobile-connector.mjs'
      - 'server/mobile-tuverso-routes.mjs'
      - 'server/tuverso-mobile-connector.test.mjs'
      - 'server/mobile-tuverso-routes.test.mjs'
      - '.github/workflows/admin-b3-mobile-form-focal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  form-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check only touched S2S routes and tests
        run: |
          node --check server/tuverso-mobile-connector.mjs
          node --check server/mobile-tuverso-routes.mjs
          node --check server/tuverso-mobile-connector.test.mjs
          node --check server/mobile-tuverso-routes.test.mjs
      - name: Targeted MOBILE_APP FORM and legacy retry checks
        run: node --test server/tuverso-mobile-connector.test.mjs server/mobile-tuverso-routes.test.mjs
