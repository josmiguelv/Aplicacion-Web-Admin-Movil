name: Admin Web PRE-F2 08 · TU VERSO authority focal
on:
  push:
    branches: [fix/admin-tuverso-authority-latest-20261121]
    paths:
      - 'server/mobile-tuverso-routes.mjs'
      - 'server/integrations.mjs'
      - 'src/app/TuVersoIntegrations.tsx'
      - 'server/mobile-tuverso-routes.test.mjs'
      - 'server/tuverso-permission-authority.test.mjs'
      - '.github/workflows/admin-tuverso-authority-focal.yml'
  workflow_dispatch:
concurrency:
  group: admin-tuverso-auth-focal-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  delegated-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install exact locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Syntax-check only changed backend modules and tests
        run: |
          node --check server/mobile-tuverso-routes.mjs
          node --check server/integrations.mjs
          node --check server/mobile-tuverso-routes.test.mjs
          node --check server/tuverso-permission-authority.test.mjs
      - name: Focused S2S authorization and existing mobile-route regression
        run: node --test server/tuverso-permission-authority.test.mjs server/mobile-tuverso-routes.test.mjs
      - name: Typecheck changed integration UI and its imported modules only
        run: |
          node --input-type=module <<'NODE'
          import ts from 'typescript'
          import path from 'node:path'
          const cfg=path.resolve('tsconfig.app.json')
          const c=ts.readConfigFile(cfg,ts.sys.readFile)
          if(c.error)throw Error(ts.flattenDiagnosticMessageText(c.error.messageText,'\n'))
          const options=ts.parseJsonConfigFileContent(c.config,ts.sys,process.cwd(),{},cfg)
          const target=path.resolve('src/app/TuVersoIntegrations.tsx')
          const program=ts.createProgram([target],options.options)
          const diag=ts.getPreEmitDiagnostics(program).filter(d=>!d.file||path.resolve(d.file.fileName)===target)
          if(diag.length){
           console.error(ts.formatDiagnosticsWithColorAndContext(diag,{
            getCurrentDirectory:ts.sys.getCurrentDirectory,
            getCanonicalFileName:x=>x,
            getNewLine:()=>ts.sys.newLine,
           }))
           process.exit(1)
          }
          console.log('Admin TU VERSO PRE-F2/08 focused TypeScript PASS')
          NODE
