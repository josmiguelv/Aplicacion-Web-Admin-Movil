name: Admin API Keys — pruebas focalizadas
on:
  push:
    branches: [feat/admin-saas-multitenant-login]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: admin_api_keys_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d admin_api_keys_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/admin_api_keys_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check edited backend syntax
        run: node --check server/service-api-keys.mjs && node --check server/static-path-policy.mjs && node --check server/scheduled-notifications.mjs && node --check server/index.mjs
      - name: Validate Windows and Railway static paths
        run: node --test server/static-path-policy.test.mjs
      - name: Validate tunnel login origin policy
        run: node --test server/admin-origin-policy.test.mjs
      - name: Build frontend
        run: pnpm build
      - name: Mobile weekly store hours contract (focused)
        run: node --test server/mobile-store-hours.test.mjs
      - name: TU VERSO credential formats (focused)
        run: node --test server/tuverso-credential-format.test.mjs
      - name: Focused PostgreSQL and HTTP integration tests
        run: node server/service-api-keys.test.mjs
      - name: Focused store deletion and product preview editing
        run: node server/catalog-operations.test.mjs
      - name: Focused commercial CRUD — payments, promotions, catalog, apps and accounts
        run: node server/commercial-crud.test.mjs
      - name: Focused scheduled notification API and image access
        run: node server/scheduled-notifications.test.mjs
